services:
  - type: web
    name: knou-cs-ai-navigator
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port ${PORT:-8000}
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: NOTION_TOKEN
        sync: false
      - key: NOTION_KNOWLEDGE_DB_ID
        value: 38773fbd195180788faac9a54ae8e512
      - key: NOTION_STATS_DB_ID
        value: 38773fbd195180708158dc38ec3fbd2f
      - key: ADMIN_PASSWORD
        sync: false
      - key: LLM_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_API_KEY_2
        sync: false
      - key: GEMINI_API_KEY_3
        sync: false
      - key: GEMINI_PRIMARY_KEY
        value: "3"
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_FALLBACK_MODELS
        value: gemini-2.0-flash
      - key: GEMINI_MAX_OUTPUT_TOKENS
        value: "1024"
      - key: LLM_TIMEOUT_SEC
        value: "45"
      - key: PUBLIC_LOADER_URL
        value: https://mhjang-qa.github.io/ComPass/
      - key: STARTUP_INDEX_LOAD
        value: "true"
      - key: COMMUNITY_CRAWL_ENABLED
        value: "true"
      - key: COMMUNITY_LIST_PAGES
        value: "5"
      - key: COMMUNITY_MAX_DOCUMENTS
        value: "100"
      - key: COMMUNITY_DELAY_SECONDS
        value: "1.5"
